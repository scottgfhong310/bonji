<!doctype html>
<html lang="zh-Hant" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title data-i18n-doctitle="catalog.title">Bonji — 悉曇字型對照表</title>

  <!-- 防主題閃爍：先讀 localStorage 設好 data-theme + light/dark-mode class（與轉換頁共用 bonji-theme） -->
  <script>try { var t = localStorage.getItem('bonji-theme') || 'dark'; var r = document.documentElement; r.dataset.theme = t; r.classList.add(t === 'light' ? 'light-mode' : 'dark-mode'); } catch (e) {}</script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
  <link rel="stylesheet" href="./materialize-dark.css" />
  <link rel="stylesheet" href="./bonji.css" />
  <link rel="stylesheet" href="./side-tool.css" />
  <link rel="stylesheet" href="./catalog.css" />
</head>

<body>
  <main>
    <div class="catalog-container">
      <header class="app-header">
        <h1 data-i18n="catalog.title">悉曇字型對照表</h1>
        <p class="subtitle" data-i18n="catalog.subtitle">依 BonjiInput.xlsx；一欄一類（母音 / 子音 / 異體字 / 符號 / 體文 / 接續 / 上接續 / 下接續）。每格依其字型顯示。點格可複製輸入記法。</p>
      </header>

      <!-- 缺本機字型時的說明（由 catalog.js 透過 BonjiFonts.noticeHtml 填入；有裝則保持空） -->
      <div id="font-notice"></div>

      <!-- 各欄（一類一欄）由 catalog.js 依 data/catalog.json 產生 -->
      <div id="catalog-cols" class="catalog-cols"></div>

      <footer class="app-footer">
        <span data-i18n-html="catalog.credit">
          字型：Unicode 悉曇 <a href="https://github.com/mandel59/bonji-input" target="_blank" rel="noopener">Noto Sans Siddham</a>（OFL，隨程式附上）；Mojikyo M119 與 Siddam 讀取<strong>本機安裝</strong>的版本，未隨程式散布。
        </span>
      </footer>
    </div>
  </main>

  <!-- ===== 右側工具列（flex 自動堆疊） ===== -->
  <div class="side-tools">
    <a id="setting-home" class="side-tool" href="./" data-i18n-title="tool.home" title="回轉換器">
      <i class="material-icons">arrow_back</i>
    </a>
    <div id="setting-mode" class="side-tool" data-i18n-title="tool.mode" title="切換 light / dark">
      <i class="material-icons">dark_mode</i>
    </div>
    <div id="setting-lang" class="side-tool" data-i18n-title="tool.lang" title="Language">
      <i class="material-icons">translate</i>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="./i18n.js"></script>
  <script src="./locales/zh-Hant.js"></script>
  <script src="./locales/en.js"></script>
  <script src="./locales/ja.js"></script>
  <script src="./side-tool.js"></script>   <!-- 共用 utility：側鍵行為（check 微回饋＋溢出收納） -->
  <script src="./font-availability.js"></script>   <!-- 本機字型偵測 + 缺字型說明（classic → window.BonjiFonts） -->
  <script type="module" src="./catalog.js"></script>
</body>

</html>
